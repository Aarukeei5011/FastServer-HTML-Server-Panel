<style>
:root{color-scheme:dark;--bg:#10151e;--panel:#171e2a;--raised:#202a39;--line:#303d50;--fg:#e6edf6;--muted:#9aabc0;--accent:#65c8ed;--green:#65d7a1;--red:#ff9494;--amber:#f2c477;--shadow:0 8px 24px #0002}html[data-theme=light]{color-scheme:light;--bg:#f2f5fa;--panel:#fff;--raised:#edf2f8;--line:#d5dfea;--fg:#172438;--muted:#51647b;--accent:#176eaa;--green:#167a50;--red:#ba303d;--amber:#8b590c;--shadow:0 8px 24px #233c5610}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,input,select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:9px 12px}button{cursor:pointer;font-weight:600}button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:var(--accent);color:#10202a;border-color:transparent}html[data-theme=light] button.primary{color:white}button.danger{color:var(--red)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input,select,textarea{min-width:0}input[type=checkbox]{accent-color:var(--accent)}a{color:var(--accent)}h1,h2,h3,p{margin:0}h1{font-size:25px;line-height:1.3}h2{font-size:17px}h3{font-size:15px}small,.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;align-items:center;gap:11px;padding:0 7px}.mark{background:var(--accent);color:#10202a;display:grid;place-items:center;width:40px;height:40px;border-radius:11px;font-size:19px;font-weight:900}.brand strong{font-size:18px;letter-spacing:-.5px}.eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--muted);font-weight:700}.nav{display:grid;gap:5px}.nav button{text-align:left;background:none;border-color:transparent;color:var(--muted)}.nav button.active{background:var(--raised);color:var(--accent);border-color:var(--line)}.side-bottom{margin-top:auto;padding:9px;display:grid;gap:8px}.main{min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:16px 26px;background:var(--panel)}.top .row{gap:8px}.row,.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.grow{flex:1;min-width:0}.workspace{max-width:1500px;margin:auto;padding:26px;display:grid;gap:18px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.heading p{color:var(--muted);margin-top:5px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:18px;min-width:0;display:grid;gap:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:12px}.metrics{grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}.metric strong{font-size:30px;font-variant-numeric:tabular-nums;line-height:1.2}.metric{gap:5px}.pill{font-size:12px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--muted);white-space:nowrap}.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.ok{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}.server-title{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.server-title h2{overflow-wrap:anywhere}.kv{display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr);gap:5px 12px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}.kv{margin:0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-size:12px;background:var(--raised);white-space:nowrap}tr:last-child td{border:0}td:first-child{overflow-wrap:anywhere;min-width:140px}td .actions{min-width:150px}button.small{padding:5px 9px;font-size:12px}.file-name{background:none;border:0;color:var(--accent);padding:3px;text-align:left;overflow-wrap:anywhere}.empty{color:var(--muted);padding:25px 8px;text-align:center}.notice{padding:12px 15px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;background:var(--panel);overflow-wrap:anywhere}.notice.bad{border-left-color:var(--red)}.terminal{background:#0a0e15;color:#d0e0d4;border:1px solid #303d50;border-radius:9px;padding:14px;min-height:320px;height:clamp(320px,50vh,600px);overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,Consolas,monospace;margin:0}.terminal .error{color:#ff9f9f}.terminal .warning{color:#f2c477}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.toolbar input[type=search]{flex:1;min-width:130px}.breadcrumbs{display:flex;flex-wrap:wrap;align-items:center;gap:5px;overflow-wrap:anywhere}.breadcrumbs button{background:none;border:0;padding:3px 5px;color:var(--accent)}progress{width:100%;height:12px;accent-color:var(--accent)}dialog{color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0;width:min(640px,calc(100% - 24px));max-height:90vh;box-shadow:0 25px 80px #0006}dialog::backdrop{background:#0009}.dialog-head,.dialog-foot{padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}.dialog-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}.dialog-body{padding:20px;display:grid;gap:13px;overflow:auto}.field{display:grid;gap:5px}.field textarea{resize:vertical;min-height:100px;width:100%;font-family:ui-monospace,Consolas,monospace}.field label{font-weight:600}.check{display:flex;align-items:center;gap:8px}.dialog-error{color:var(--red);white-space:pre-wrap;overflow-wrap:anywhere}.toasts{position:fixed;right:16px;bottom:16px;width:min(380px,calc(100vw - 32px));display:grid;gap:8px;z-index:10}.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--green);padding:12px;border-radius:9px;box-shadow:var(--shadow);overflow-wrap:anywhere}.toast.bad{border-left-color:var(--red)}.json{max-height:400px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--raised);padding:12px;border-radius:8px;font:12px/1.5 ui-monospace,monospace}.hide,[hidden]{display:none!important}.spacer{flex:1}.link{background:none;border:0;color:var(--accent);padding:0}.nowrap{white-space:nowrap}@media(max-width:800px){.shell{grid-template-columns:minmax(0,1fr)}.side{min-width:0;position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px;gap:8px}.nav{display:flex;overflow:auto;gap:5px;max-width:100%;min-width:0}.nav button{white-space:nowrap}.side-bottom{display:none}.top{padding:12px}.workspace{padding:14px;gap:12px}.card{padding:13px}.top select{max-width:200px}.top .row{min-width:0;max-width:100%}#baseLabel{overflow-wrap:anywhere;min-width:0}.workspace{min-width:0}.card{min-width:0}.terminal{min-width:0}h1{font-size:21px}}@media(prefers-reduced-motion:no-preference){button{transition:border-color .15s}}

<body>
<div class="shell"><aside class="side"><div class="brand"><div class="mark">F</div><div><strong>FastServer</strong><div class="eyebrow">MANAGEMENT PANEL 2.1</div></div></div><nav id="nav" class="nav" aria-label="管理メニュー"></nav><div class="side-bottom"><span class="eyebrow">DOCUMENTATION</span><a href="https://fss.zpw.jp/" target="_blank" rel="noopener noreferrer">FastServer 公式サイト ↗</a><a href="https://api.zpw.jp/fastserver/specs/" target="_blank" rel="noopener noreferrer">HTTP API 仕様 ↗</a><small>非公式クライアント / v2.0</small></div></aside><main class="main"><header class="top"><div class="row"><span id="connection" class="pill">未接続</span><span id="plan" class="pill">プラン —</span><small id="baseLabel"></small></div><div class="row"><label for="serverSelect" class="muted">対象サーバー</label><select id="serverSelect" aria-label="対象サーバー"><option value="">未選択</option></select><button id="theme" aria-label="テーマ切替">☀ / ☾</button><button id="settings">接続設定</button></div></header><div class="workspace"><div class="heading"><div><h1 id="heading"></h1><p id="subtitle"></p></div><div class="row"><small id="updated">未更新</small><button id="refresh">更新</button></div></div><div id="banner" class="notice" role="status" hidden></div><section id="view"></section></div></main></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><form id="dialogForm"><div class="dialog-head"><h2 id="dialogTitle"></h2><button type="button" id="dialogClose" aria-label="閉じる">×</button></div><div class="dialog-body" id="dialogBody"></div><div class="dialog-foot"><button type="button" id="dialogCancel">閉じる</button><button type="submit" class="primary" id="dialogSubmit">実行</button></div></form></dialog><div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), enc=encodeURIComponent, bytes=s=>new TextEncoder().encode(s).length, MiB=1024*1024;
const LIMIT={json:512*1024,command:8*1024,read:MiB,upload:64*MiB};
const DEFAULT='http://localhost:4001/api';
const S={base:DEFAULT,key:'',auth:'bearer',auto:true,interval:15,connected:false,plan:null,servers:[],id:'',tab:'dashboard',path:'',logs:[],epoch:0,seq:0,pending:false,busy:0,connectSeq:0,controllers:new Set(),consoleLines:[],tail:200,consoleAuto:true,follow:true,consoleFilter:'',history:[],historyPos:0,fileFilter:'',serverFilter:'',jobFilter:'',logFilter:'',jobs:[],files:[],last:null,health:null,processHealth:null,diagnostics:[],timer:null};
const PAGES={dashboard:['概要','登録済みサーバーと接続情報'],servers:['サーバー管理','起動・停止・再起動・稼働状態'],console:['コンソール','ログの確認とコマンド送信'],files:['ファイル管理','閲覧・編集・転送・圧縮・展開'],jobs:['ジョブ管理','ZIP圧縮・展開の進捗とキャンセル'],backups:['ZIPバックアップ','指定ディレクトリの圧縮と展開'],logs:['操作履歴','このパネルで行った操作の記録'],api:['API診断','疎通確認・利用プラン・仕様情報'],reference:['APIリファレンス','公式仕様に基づく28エンドポイントの詳細']};
const node=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=String(text??'—');return e};
const add=(p,...children)=>{children.flat().filter(Boolean).forEach(x=>p.append(x));return p};
const btn=(label,fn,cls='',disabled=false)=>{const b=node('button',cls,label);b.type='button';b.disabled=disabled;b.addEventListener('click',async()=>{try{await fn(b)}catch(e){if(e.name!=='AbortError')toast(safeError(e),true)}});return b};
const box=(...children)=>add(node('div','card'),children), row=(...children)=>add(node('div','row'),children), actions=(...children)=>add(node('div','actions'),children), empty=t=>node('div','empty',t), notice=(t,err=false)=>node('div','notice'+(err?' bad':''),t), h2=t=>node('h2','',t);
function kv(obj){const d=node('dl','kv');for(const [k,v] of Object.entries(obj))add(d,node('dt','',k),node('dd','',v===undefined||v===null?'—':typeof v==='object'?JSON.stringify(v):v));return d}
function pill(t){const str=String(t??'UNKNOWN'),u=str.toUpperCase(),c=['RUNNING','COMPLETED','OK','CONNECTED'].includes(u)?'ok':['STOPPED','FAILED','ERROR','CANCELED','NOT_RUNNING'].includes(u)?'bad':['STARTING','STOPPING','QUEUED','CANCELING'].includes(u)?'warn':'';return node('span','pill '+c,str)}
function toast(t,bad=false){const el=node('div','toast'+(bad?' bad':''),t);$('toasts').append(el);setTimeout(()=>el.remove(),5500)}
function safeError(e){let m=String(e?.message||e||'不明なエラー');if(S.key)m=m.split(S.key).join('[REDACTED]');return m}
function storageGet(k){try{return localStorage.getItem(k)}catch{return null}}function storageSet(k,v){try{localStorage.setItem(k,v)}catch{}}function storageDel(k){try{localStorage.removeItem(k)}catch{}}
function log(type,action,id=''){S.logs.unshift({time:new Date().toISOString(),type,action: S.key?String(action).split(S.key).join('[REDACTED]'):String(action),server:id});S.logs=S.logs.slice(0,500);if(S.tab==='logs'&&!$('dialog').open)render()}
function errorBanner(t=''){const b=$('banner');b.hidden=!t;b.textContent=t;b.className='notice bad'}
function fmtSize(n){if(n===null||n===undefined||!Number.isFinite(Number(n))||Number(n)<0)return '—';let v=Number(n),i=0;while(v>=1024&&i<4){v/=1024;i++}return `${v.toLocaleString('ja-JP',{maximumFractionDigits:1})} ${['B','KiB','MiB','GiB','TiB'][i]}`}
function fmtUnix(t){if(t==null||t==='')return '—';const n=Number(t);return Number.isFinite(n)&&Number.isFinite(new Date(n*1000).valueOf())?new Date(n*1000).toLocaleString('ja-JP'):String(t)}
function fmtTime(t){if(t==null||t==='')return '—';const n=typeof t==='number'?(t<1e12?t*1000:t):t;const d=new Date(n);return Number.isNaN(d.valueOf())?String(t):d.toLocaleString('ja-JP')}
function selected(){return S.servers.find(s=>String(s.id)===S.id)}
function srv(id,route=''){if(!id)throw Error('対象サーバーを選択してください。');return '/servers/'+enc(String(id))+route}
function query(path,params){return path+'?'+new URLSearchParams(params).toString()}
function relative(p,allowRoot=false){p=String(p??'');if(!p&&allowRoot)return '';if(!p||p.startsWith('/')||/[\\:*?\[\]\u0000-\u001f]/.test(p)||p.split('/').some(x=>!x||x==='.'||x==='..'))throw Error('サーバー基準の相対パスを指定してください（絶対パス、..、ワイルドカード等は不可）。');return p}
function join(p,n){return relative(p?p+'/'+n:n)}
function normalizeBase(input){const u=new URL(input.trim());if(!['http:','https:'].includes(u.protocol)||u.username||u.password||u.search||u.hash)throw Error('HTTP(S) URLを指定してください。認証情報・クエリ・フラグメントは不可です。');u.pathname=u.pathname.replace(/\/+$/,'');if(!u.pathname.endsWith('/api'))u.pathname+='/api';return u.toString().replace(/\/$/,'')}
function apiURL(path,process=false){return (process?new URL(S.base).origin:S.base)+path}
function stopRequests(){for(const c of S.controllers)c.abort();S.controllers.clear();S.seq++;S.epoch++;S.pending=false}
async function request(path,{method='GET',body,raw,process=false,download=false,timeout=20000}={}){const epoch=S.epoch,controller=new AbortController();const headers={Accept:download?'*/*':'application/json'};if(S.key)headers[S.auth==='x-fs-key'?'x-fs-key':'Authorization']=S.auth==='x-fs-key'?S.key:'Bearer '+S.key;let payload;if(raw!==undefined){if(raw.size>LIMIT.upload)throw Error('アップロード上限は64 MiBです。');headers['Content-Type']='application/octet-stream';payload=raw}else if(body!==undefined){payload=JSON.stringify(body);const max=path.endsWith('/command')?LIMIT.command:LIMIT.json;if(bytes(payload)>max)throw Error('JSONリクエスト上限 '+fmtSize(max)+' を超えています。');headers['Content-Type']='application/json'}S.controllers.add(controller);const timer=setTimeout(()=>controller.abort(),timeout);try{const r=await fetch(apiURL(path,process),{method,headers,body:payload,signal:controller.signal,cache:'no-store',credentials:'omit',redirect:'error',referrerPolicy:'no-referrer'});if(epoch!==S.epoch)throw new DOMException('接続変更','AbortError');if(download&&r.ok){const blob=await r.blob();if(epoch!==S.epoch)throw new DOMException('接続変更','AbortError');return blob;}const text=await r.text();let data;try{data=text?JSON.parse(text):null}catch{throw Error(`HTTP ${r.status}: JSONではない応答です。API URLを確認してください。`)}if(epoch!==S.epoch)throw new DOMException('接続変更','AbortError');if(!r.ok||data?.ok===false||data?.status==='false'||data?.status===false){const hint={401:'認証失敗',403:'API無効またはアクセス拒否',404:'対象またはAPIが見つかりません',405:'メソッドが許可されていません'}[r.status]||'APIエラー';throw Error(`HTTP ${r.status} ${hint}: ${data?.error||data?.message||r.statusText}`)}if(data===null)throw Error('空のAPI応答です。');return data}catch(e){if(epoch!==S.epoch)throw new DOMException('接続変更','AbortError');if(e.name==='AbortError')throw Error('通信がタイムアウトしました。');if(e instanceof TypeError)throw Error('通信失敗：API起動状態、URL、CORS、HTTPS混在コンテンツを確認してください。');throw e}finally{clearTimeout(timer);S.controllers.delete(controller)}}
function updateHeader(){const c=$('connection');c.className='pill '+(S.connected?'ok':'');c.textContent=S.connected?'接続済み':'未接続';$('plan').textContent='プラン '+(S.plan??'—');$('baseLabel').textContent=S.base;const sel=$('serverSelect');sel.replaceChildren();const placeholder=node('option','','未選択');placeholder.value='';sel.append(placeholder);for(const s of S.servers){const opt=node('option','',s.name??s.id);opt.value=String(s.id);sel.append(opt)}sel.value=S.id;sel.disabled=!S.connected||S.busy>0;$('refresh').disabled=S.busy>0||!S.connected;$('updated').textContent=S.last?'更新 '+fmtTime(S.last):'未更新'}
function ensureArray(v,label){if(!Array.isArray(v))throw Error(label+' の応答形式が仕様と異なります。');return v}
async function getServers(){const d=await request('/servers');S.servers=ensureArray(d.servers,'servers');if(!S.servers.some(s=>String(s.id)===S.id)){S.id=S.servers.length?String(S.servers[0].id):'';S.path='';S.files=[];S.consoleLines=[]}updateHeader()}
function switchView(tab){if(S.busy)return;S.tab=tab;S.seq++;S.pending=false;errorBanner();render();refresh()}
async function refresh({quiet=false}={}){if(!S.connected||S.pending||S.busy)return;const seq=++S.seq,epoch=S.epoch,tab=S.tab,id=S.id,path=S.path;S.pending=true;const current=()=>seq===S.seq&&epoch===S.epoch;try{if(tab==='dashboard'||tab==='servers'){const d=await request('/servers');if(!current())return;S.servers=ensureArray(d.servers,'servers');if(!selected()){S.id=S.servers.length?String(S.servers[0].id):'';S.path='';S.consoleLines=[];S.files=[]}}else if(tab==='console'&&id){const d=await request(query(srv(id,'/console/tail'),{lines:S.tail}));if(!current())return;S.consoleLines=ensureArray(d.log,'log')}else if(tab==='files'&&id){const d=await request(query(srv(id,'/files/list'),{path}));if(!current())return;S.path=relative(d.path??path,true);S.files=ensureArray(d.items,'items')}else if(tab==='jobs'){const d=await request('/jobs');if(!current())return;S.jobs=ensureArray(d.jobs,'jobs')}else if(tab==='api'){await diagnostics(false);if(!current())return}else return;S.last=Date.now();errorBanner();updateHeader();if(tab==='console'&&$('terminal'))renderTerminal();else render()}catch(e){if(current()&&e.name!=='AbortError'){errorBanner(safeError(e));if(!quiet)log('error','取得失敗: '+safeError(e),id)}}finally{if(current())S.pending=false}}
function autoTimer(){clearInterval(S.timer);S.timer=setInterval(()=>{if(!S.connected||!S.auto||document.hidden||$('dialog').open||S.busy)return;if(S.tab==='console'&&S.consoleAuto)refresh({quiet:true});else if(['dashboard','servers','jobs'].includes(S.tab)&&Date.now()-(S.last||0)>=S.interval*1000)refresh({quiet:true})},3000)}
async function connect(config){stopRequests();const token=++S.connectSeq;Object.assign(S,config,{connected:false,plan:null,servers:[],id:'',files:[],jobs:[],consoleLines:[],path:'',last:null,health:null,processHealth:null,diagnostics:[]});updateHeader();render();errorBanner();try{const d=await request('/check_alive');if(token!==S.connectSeq)return;if(d.status!=='ok')throw Error('ヘルスチェックが正常応答ではありません。');S.health=d;await getServers();if(token!==S.connectSeq)return;S.connected=true;try{const p=await request('/check_plan');if(token===S.connectSeq)S.plan=p.plan??null}catch(e){if(token===S.connectSeq)log('warning','プラン取得不可: '+safeError(e))}if(token!==S.connectSeq)return;S.last=Date.now();updateHeader();render();log('success','API接続成功');toast('FastServer APIに接続しました。');await refresh()}catch(e){if(token!==S.connectSeq)return;S.connected=false;S.servers=[];S.id='';updateHeader();render();errorBanner(safeError(e));log('error','接続失敗: '+safeError(e));toast(safeError(e),true);throw e}}
function disconnect(){stopRequests();S.connectSeq++;Object.assign(S,{key:'',connected:false,plan:null,id:'',servers:[],files:[],jobs:[],consoleLines:[],path:'',health:null,processHealth:null,diagnostics:[],last:null,history:[]});updateHeader();render();errorBanner();log('info','切断しました')}
